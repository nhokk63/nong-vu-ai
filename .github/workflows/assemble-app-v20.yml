name: Assemble V20 app.js
on:
  push:
    paths:
      - '_v20apptrigger'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble app.js
        shell: bash
        run: |
          set -euo pipefail
          for f in _v20app/app.*; do test -s "$f"; done
          cat _v20app/app.* > app.js
          rm -rf _v20app _v20apptrigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js _v20app _v20apptrigger
          git commit -m 'Update app.js to Nông Vụ AI v20 PRO' || exit 0
          git push
