name: One-time Groq AI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Groq provider
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('_worker.js')
          s = p.read_text(encoding='utf-8')

          start = s.index('async function callChatProvider')
          end = s.index('\nfunction adviceSystem()', start)

          new_fn = r'''async function callChatProvider(env, system, user, image){
  const messages=[{role:'system',content:system}];
  const isImage=!!(image && typeof image==='string' && image.startsWith('data:image/'));
  const userContent=isImage
    ? [{type:'text',text:user},{type:'image_url',image_url:{url:image}}]
    : user;
  messages.push({role:'user',content:userContent});

  const errors=[];

  // Groq is primary. Llama 3.3 70B was deprecated on 2026-08-16,
  // so use current fast models instead.
  if(env.GROQ_API_KEY){
    const models=isImage
      ? [env.GROQ_VISION_MODEL||'qwen/qwen3.6-27b']
      : [env.GROQ_MODEL||'openai/gpt-oss-120b', 'openai/gpt-oss-20b'];

    for(const model of models){
      try{
        const payload={
          model,
          messages,
          temperature:isImage?0.1:0.15,
          max_completion_tokens:1200,
          response_format:{type:'json_object'}
        };
        if(model.startsWith('openai/gpt-oss-')){
          payload.reasoning_effort='low';
          payload.reasoning_format='hidden';
        }else if(model.startsWith('qwen/')){
          payload.reasoning_effort='none';
        }

        const ctrl=new AbortController();
        const timer=setTimeout(()=>ctrl.abort(),45000);
        let r;
        try{
          r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':`Bearer ${env.GROQ_API_KEY}`},
            body:JSON.stringify(payload),
            signal:ctrl.signal
          });
        } finally { clearTimeout(timer); }

        const d=await r.json().catch(()=>({}));
        if(!r.ok){
          errors.push(`Groq ${model}: ${d?.error?.message||`HTTP ${r.status}`}`);
          continue;
        }
        const out=d?.choices?.[0]?.message?.content||'';
        const parsed=extractJson(out);
        if(parsed) return parsed;
        errors.push(`Groq ${model}: phản hồi không phải JSON hợp lệ`);
      }catch(e){
        errors.push(`Groq ${model}: ${e?.name==='AbortError'?'timeout':(e?.message||String(e))}`);
      }
    }
  }else{
    errors.push('Groq: chưa cấu hình GROQ_API_KEY');
  }

  // OpenRouter remains the final fallback and never auto-selects a paid model.
  if(env.OPENROUTER_API_KEY){
    try{
      const model=isImage
        ? (env.OPENROUTER_VISION_MODEL||'openrouter/free')
        : (env.OPENROUTER_MODEL||'openrouter/free');
      const payload={model,messages,temperature:0.15,max_tokens:1200};
      const ctrl=new AbortController();
      const timer=setTimeout(()=>ctrl.abort(),60000);
      let r;
      try{
        r=await fetch('https://openrouter.ai/api/v1/chat/completions',{
          method:'POST',
          headers:{
            'Content-Type':'application/json',
            'Authorization':`Bearer ${env.OPENROUTER_API_KEY}`,
            'HTTP-Referer':env.APP_BASE_URL||'https://nhokk63.github.io/nong-vu-ai/',
            'X-Title':'Nong Vu AI'
          },
          body:JSON.stringify(payload),
          signal:ctrl.signal
        });
      } finally { clearTimeout(timer); }
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d?.error?.message||`HTTP ${r.status}`);
      const out=d?.choices?.[0]?.message?.content||'';
      const parsed=extractJson(out);
      if(parsed) return parsed;
      throw new Error('phản hồi không phải JSON hợp lệ');
    }catch(e){
      errors.push(`OpenRouter: ${e?.name==='AbortError'?'timeout':(e?.message||String(e))}`);
    }
  }else{
    errors.push('OpenRouter: chưa cấu hình OPENROUTER_API_KEY');
  }

  if(isImage){
    throw new Error(`AI vision không phản hồi. ${errors.join(' | ')}`);
  }
  throw new Error(`AI cloud không phản hồi. ${errors.join(' | ')}`);
}'''

          s = s[:start] + new_fn + s[end:]
          p.write_text(s, encoding='utf-8')

          w = Path('wrangler.toml')
          if w.exists():
            ws = w.read_text(encoding='utf-8')
            ws = ws.replace('GROQ_MODEL = "llama-3.3-70b-versatile"', 'GROQ_MODEL = "openai/gpt-oss-120b"')
            if 'GROQ_VISION_MODEL' not in ws:
              ws = ws.replace('GROQ_MODEL = "openai/gpt-oss-120b"', 'GROQ_MODEL = "openai/gpt-oss-120b"\nGROQ_VISION_MODEL = "qwen/qwen3.6-27b"')
            w.write_text(ws, encoding='utf-8')

          idx = Path('index.html')
          if idx.exists():
            ix = idx.read_text(encoding='utf-8')
            ix = ix.replace('app.js?v=21', 'app.js?v=22')
            ix = ix.replace('styles.css?v=21', 'styles.css?v=22')
            ix = ix.replace('app.js?v=20', 'app.js?v=22')
            ix = ix.replace('styles.css?v=20', 'styles.css?v=22')
            if 'modal-fix.js?v=22' not in ix:
              ix = ix.replace('<script src="./app.js?v=22" type="module"></script>', '<script src="./modal-fix.js?v=21"></script>\n<script src="./app.js?v=22" type="module"></script>')
            idx.write_text(ix, encoding='utf-8')

          sw = Path('sw.js')
          if sw.exists():
            ss = sw.read_text(encoding='utf-8')
            ss = ss.replace("const VERSION='nongvu-ai-v21.1'", "const VERSION='nongvu-ai-v22'")
            ss = ss.replace('app.js?v=21','app.js?v=22').replace('styles.css?v=21','styles.css?v=22')
            sw.write_text(ss, encoding='utf-8')

      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js wrangler.toml index.html sw.js
          git rm -f .github/workflows/fix-groq-v22.yml
          git commit -m "fix: migrate from deprecated Groq Llama and improve AI fallbacks" || exit 0
          git push origin HEAD:main
