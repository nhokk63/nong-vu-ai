name: Patch v24

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v24]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v24 fixes
        env:
          PATCH_B64: "
          PATCH_DUMMY: "v24"
        run: |
          python3 -c "import base64; exec(base64.b64decode('${PATCH_B64}'))"

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js wrangler.toml
          git commit -m 'fix: robust Telegram actions and chemical candidates [v24]' || exit 0
          git push origin HEAD:main
