name: Patch v24

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v24]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic patch
        run: python3 .github/patch-v24.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js wrangler.toml
          git commit -m 'fix: Telegram actions and chemical candidates [v24]' || exit 0
          git push origin HEAD:main
