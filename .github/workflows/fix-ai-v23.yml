name: Fix AI provider v23

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ai-v23]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch worker AI provider
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_worker.js')
          s = p.read_text(encoding='utf-8')
          start = s.index('async function callChatProvider')
          end = s.index('\nfunction adviceSystem()', start)
          new_fn = r'''async function callChatProvider(env, system, user, image){
  const messages=[{role:'system',content:system}];
  const isImage=!!(image && typeof image==='string' && image.startsWith('data:image/'));
  const userContent=isImage
    ? [{type:'text',text:user},{type:'image_url',image_url:{url:image}}]
    : user;
  messages.push({role:'user',content:userContent});

  const errors=[];

  // Groq is the primary provider. Do not depend on dashboard vars for model IDs.
  if(env.GROQ_API_KEY){
    const models=isImage
      ? ['qwen/qwen3.6-27b']
      : ['openai/gpt-oss-120b','openai/gpt-oss-20b'];

    for(const model of models){
      try{
        const payload={
          model,
          messages,
          temperature:isImage?0.1:0.15,
          max_completion_tokens:1200,
          response_format:{type:'json_object'}
        };
        if(model.startsWith('openai/gpt-oss-')) payload.reasoning_effort='low';
        const ctrl=new AbortController();
        const timer=setTimeout(()=>ctrl.abort(),45000);
        let r;
        try{
          r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':`Bearer ${env.GROQ_API_KEY}`},
            body:JSON.stringify(payload),
            signal:ctrl.signal
          });
        } finally { clearTimeout(timer); }
        const d=await r.json().catch(()=>({}));
        if(!r.ok){
          errors.push(`Groq ${model}: ${d?.error?.message||`HTTP ${r.status}`}`);
          continue;
        }
        const out=d?.choices?.[0]?.message?.content||'';
        const parsed=extractJson(out);
        if(parsed) return parsed;
        errors.push(`Groq ${model}: JSON không hợp lệ`);
      }catch(e){
        errors.push(`Groq ${model}: ${e?.name==='AbortError'?'timeout':(e?.message||String(e))}`);
      }
    }
  }else{
    errors.push('Groq: thiếu GROQ_API_KEY');
  }

  // OpenRouter is a final fallback.
  if(env.OPENROUTER_API_KEY){
    try{
      const model=isImage
        ? (env.OPENROUTER_VISION_MODEL||'openrouter/free')
        : (env.OPENROUTER_MODEL||'openrouter/free');
      const payload={model,messages,temperature:0.15,max_tokens:1200};
      const ctrl=new AbortController();
      const timer=setTimeout(()=>ctrl.abort(),60000);
      let r;
      try{
        r=await fetch('https://openrouter.ai/api/v1/chat/completions',{
          method:'POST',
          headers:{
            'Content-Type':'application/json',
            'Authorization':`Bearer ${env.OPENROUTER_API_KEY}`,
            'HTTP-Referer':env.APP_BASE_URL||'https://nhokk63.github.io/nong-vu-ai/',
            'X-Title':'Nong Vu AI'
          },
          body:JSON.stringify(payload),
          signal:ctrl.signal
        });
      } finally { clearTimeout(timer); }
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d?.error?.message||`HTTP ${r.status}`);
      const out=d?.choices?.[0]?.message?.content||'';
      const parsed=extractJson(out);
      if(parsed) return parsed;
      throw new Error('JSON không hợp lệ');
    }catch(e){
      errors.push(`OpenRouter: ${e?.name==='AbortError'?'timeout':(e?.message||String(e))}`);
    }
  }else{
    errors.push('OpenRouter: thiếu OPENROUTER_API_KEY');
  }

  throw new Error(`${isImage?'AI vision':'AI cloud'} lỗi provider: ${errors.join(' | ')}`);
}'''
          s = s[:start] + new_fn + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          git commit -m 'fix: harden Groq provider [ai-v23]' || exit 0
          git push origin HEAD:main
