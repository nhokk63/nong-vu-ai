name: Patch app.js to V20
on:
  push:
    paths:
      - '_v20_app_trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js
        run: python _v20_patch_app.py
      - name: Commit V20 app.js
        shell: bash
        run: |
          set -euo pipefail
          rm -f _v20_patch_app.py _v20_app_trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js _v20_patch_app.py _v20_app_trigger
          git commit -m 'Update app.js to Nông Vụ AI v20 PRO' || exit 0
          git push
