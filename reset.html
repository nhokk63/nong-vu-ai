<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nông Vụ AI · Làm sạch</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;font-family:system-ui,-apple-system,sans-serif;color:#17181c}.box{width:min(520px,calc(100% - 40px));padding:28px;border-radius:24px;background:#fff;border:1px solid #e5e7eb;box-shadow:0 16px 50px rgba(0,0,0,.08)}.mark{font-size:44px}.title{font-size:28px;font-weight:900;margin-top:8px}.muted{color:#6b7280;margin-top:8px;line-height:1.5}</style>
</head>
<body>
<div class="box"><div class="mark">🌱</div><div class="title">Đang làm sạch bộ nhớ ứng dụng…</div><div class="muted">Xóa Service Worker/cache cũ rồi mở lại Nông Vụ AI. Không xóa dữ liệu cây, lịch hay vật tư trong D1.</div></div>
<script>
(async()=>{
  try{
    const regs=await navigator.serviceWorker?.getRegistrations?.()||[];
    await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
  }catch{}
  try{
    const keys=await caches.keys();
    await Promise.all(keys.map(k=>caches.delete(k).catch(()=>false)));
  }catch{}
  try{localStorage.removeItem('nv_boot_error');}catch{}
  const target=new URL('./',location.href);
  target.searchParams.set('clean',Date.now());
  location.replace(target.href);
})();
</script>
</body>
</html>
