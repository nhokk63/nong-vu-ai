name = "nong-vu-ai"
main = "_worker.js"
compatibility_date = "2026-08-18"
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"

[vars]
OPENAI_MODEL = "gpt-5.6"

[triggers]
crons = ["0 * * * *", "0 22 * * *"]

# After creating your D1 database, put its id here OR bind DB from the Cloudflare dashboard.
# D1 is intentionally not declared here for the first deploy.
# After the Worker is created, create a D1 database and add the DB binding
# from Cloudflare Dashboard → Worker → Settings → Bindings.
