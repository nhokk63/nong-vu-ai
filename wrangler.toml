name = "nong-vu-ai"
main = "_worker.js"
compatibility_date = "2026-08-18"
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "nong-vu-ai-db"
database_id = "86a70700-a042-402e-a3f9-c2c790ce87f7"

[vars]
OPENROUTER_MODEL = "meta-llama/llama-3.3-70b-instruct:free"
OPENROUTER_VISION_MODEL = "openrouter/free"
GROQ_MODEL = "llama-3.3-70b-versatile"

[triggers]
crons = ["0 * * * *", "0 22 * * *"]

# After creating your D1 database, put its id here OR bind DB from the Cloudflare dashboard.
# D1 is intentionally not declared here for the first deploy.
# After the Worker is created, create a D1 database and add the DB binding
# from Cloudflare Dashboard → Worker → Settings → Bindings.
